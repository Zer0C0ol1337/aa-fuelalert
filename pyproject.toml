[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-fuelalert"
dynamic = ["version"]
description = "WhatsApp and Telegram fuel alerts for corporation structures and POS in Alliance Auth, based on Corptools data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Zer0C0ol | Dave" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "allianceauth>=5.0,<6",
    "allianceauth-corptools>=3.4,<4",
    "requests>=2.9",
]

[project.urls]
Homepage = "https://github.com/Zer0C0ol1337/aa-fuelalert"
Changelog = "https://github.com/Zer0C0ol1337/aa-fuelalert/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "fuelalert/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/fuelalert", "/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["/fuelalert/tests"]

[tool.hatch.build.targets.wheel]
packages = ["fuelalert"]
exclude = ["/fuelalert/tests"]
